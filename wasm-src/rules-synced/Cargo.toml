[package]
name = "flove-rules-wasm"
version = "0.1.0"
edition = "2024"
publish = false
build = "../build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
spring = { workspace = true }
spring-addons = { workspace = true }
libm = { workspace = true }
springcabal = { workspace = true }
flove-shared = { path = "../shared" }

[features]
# The Rust integration suite; it drives the rules with the e2e commands too.
headless-integration = ["e2e"]
# The visual scenario: its commands (`add_mana`, `upgrade`,
# `field_of_flowers`, `flower`). Release builds reject them.
e2e = []
# Per-event gameplay trace lines ([upgrade] ..., unit deaths) in the infolog.
diagnostics = []

[lints]
workspace = true
