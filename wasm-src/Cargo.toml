[workspace]
resolver = "2"
members = ["jobs-worker", "rules-synced", "shared", "ui"]

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Only the spring-addons export macros expand to functions with more arguments.
too_many_arguments = "allow"

[workspace.dependencies]
spring = { package = "spring-sdk", git = "https://github.com/gajop/spring-rust", rev = "782c0e8a6837ec0b8ecf5f38a4d4815debc8119a" }
spring-addons = { package = "spring-addons", git = "https://github.com/gajop/spring-rust", rev = "782c0e8a6837ec0b8ecf5f38a4d4815debc8119a" }
libm = "0.2"
springcabal = { path = "../../../../springcabal-rs/crates/springcabal" }
springcabal-control = { path = "../../../../springcabal-rs/crates/springcabal-control" }

[profile.release]
lto = "fat"
codegen-units = 1
